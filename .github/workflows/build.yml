name: build

# Library CI migrated from the SniShaper app repo (minus its GUI/CLI
# packaging legs and the release pipeline): CLA gate + cross-platform
# build/vet/test matrix + syntax-bot reporting.
#
#   push(main)                                -> test only
#   pull_request(opened/synchronize/reopened) -> CLA gate + test + bots
#   workflow_dispatch (manual)                -> test only
#
# After the contributor agreement is signed, cla.yml reruns the PR's
# original pull_request run (a rerun keeps the pull_request event, so
# the checks stay in the PR merge box); the gate then sees cla-signed
# and lets the full matrix through.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# One build per PR (or per branch); a newer push cancels the stale matrix.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # ------------------------------------------------------------------
  # CLA gate — only for pull requests. Direct pushes to main and
  # manual dispatches skip it entirely.
  # ------------------------------------------------------------------
  gate:
    name: gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide CLA gate
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          proceed=false
          if [ -n "${AUTHOR:-}" ] && is_exempt "$AUTHOR"; then
            proceed=true
          fi
          labels="$(gh_retry gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if grep -qx 'cla-signed' <<<"$labels"; then
            proceed=true
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Mark the CI round as running as soon as the gate passes.
  # ------------------------------------------------------------------
  mark-running:
    name: mark CI running
    needs: gate
    # Dependabot-triggered runs receive no repo secrets, so the syntax-bot
    # identity is unavailable there; skip the label state machine for those
    # PRs (gate still lets the test matrix through).
    if: >-
      needs.gate.outputs.proceed == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: syntax_token
        with:
          app-id: ${{ secrets.SYNTAX_BOT_APP_ID }}
          private-key: ${{ secrets.SYNTAX_BOT_PRIVATE_KEY }}

      - name: Add ci-running label
        env:
          GH_TOKEN: ${{ steps.syntax_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          # sync_labels clears ci-failed/ci-passed (mutual-exclusion group)
          # plus syntax-review, changes-requested and approved (new round)
          # automatically.
          sync_labels "$PR_NUMBER" "ci-running" ""

  # ------------------------------------------------------------------
  # Test matrix — build + vet + test on the three supported platforms,
  # with and without the with_gvisor build tag (TUN code paths).
  # ------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    needs: gate
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.gate.outputs.proceed == 'true')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build (with_gvisor)
        run: go build -tags with_gvisor ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # ------------------------------------------------------------------
  # Stable single-point summary used as the required status check in
  # branch protection ("ci"). Succeeds when every test leg succeeded
  # or was skipped (gate-skipped PR runs skip the whole matrix); fails
  # on any real failure so a red build blocks the merge.
  # ------------------------------------------------------------------
  ci:
    name: ci
    needs: [gate, test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Assert build outcome
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq '[.[] | select(.result != "success" and .result != "skipped")] | length' <<<"$RESULTS")"
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi
          echo "all required CI jobs succeeded"

  # ------------------------------------------------------------------
  # Bots — invoked directly from the build. Only for pull-request
  # rounds that passed the gate; label writes never re-trigger this
  # workflow, so there is no feedback loop.
  # ------------------------------------------------------------------
  bot-report:
    name: Report CI result (syntax-bot)
    needs: [gate, ci]
    if: >-
      always() && !cancelled() &&
      needs.gate.outputs.proceed == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN grants for the diagnostic log download; comment and
      # label writes go through the syntax-bot App token instead.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: syntax_token
        with:
          app-id: ${{ secrets.SYNTAX_BOT_APP_ID }}
          private-key: ${{ secrets.SYNTAX_BOT_PRIVATE_KEY }}

      - name: Diagnose failure and mark changes requested
        if: needs.ci.result == 'failure'
        env:
          GH_TOKEN: ${{ steps.syntax_token.outputs.token }}
          LOG_GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          # Fresh comment per CI round (per-run anchor, no upsert): each
          # round shows up in the PR timeline with a notification instead
          # of silently editing an old comment.
          body="<!-- snishaper-bot:ci-diagnostic:${RUN_ID} -->
          $(.github/scripts/bots/ci-diagnose.sh "$PR_NUMBER" "$RUN_ID")"
          gh_retry gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$body" >/dev/null
          # CI failure is itself a bot review verdict: mark the PR as
          # changes-requested so the state machine reaches its terminal
          # state without waiting for a human review.
          sync_labels "$PR_NUMBER" "ci-failed,changes-requested" ""

      - name: Mark CI passed and complete syntax review
        if: needs.ci.result == 'success'
        env:
          GH_TOKEN: ${{ steps.syntax_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source .github/scripts/bots/common.sh
          sync_labels "$PR_NUMBER" "ci-passed,syntax-review" ""
