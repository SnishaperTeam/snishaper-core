name: release

# Publish a GitHub Release for a version tag. Release notes come from
# GitHub's own "What's Changed" generator (releases/generate-notes), so
# the library keeps no hand-written changelog.
#
#   push(tag v*)      -> verify the tag builds/tests, then publish
#   workflow_dispatch -> re-publish an existing tag; an existing release
#                        is refreshed in place instead of duplicated
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.3.1)
        required: true
        type: string

permissions:
  contents: write

# Never race two publishes of the same tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          # Consumers fetch this version as a Go module, so only accept a
          # semver tag; a stray branch tag must not become a release.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # v0.4.0-rc.1 and friends are pre-releases, never "latest".
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Gate the release on the same checks as build.yml: a tag is not
      # covered by the branch CI, so verify it here before publishing.
      - name: Build
        run: go build ./...

      - name: Build (with_gvisor)
        run: go build -tags with_gvisor ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # GitHub's generated body for this tag ("What's Changed").
          notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)"

          # The generator only summarises merged pull requests, so commits
          # pushed straight to main never show up. When it listed nothing,
          # fall back to an explicit commit list: subject by author in sha.
          if ! grep -q "## What's Changed" <<<"$notes"; then
            prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
            range="$TAG"
            if [[ -n "$prev" ]]; then range="${prev}..${TAG}"; fi
            echo "generated notes have no What's Changed section - listing $range"
            commits=""
            while IFS=$'\x1f' read -r sha short subject author; do
              commits+="- ${subject} by ${author} in [${short}](${repo_url}/commit/${sha})"$'\n'
            done < <(git log --no-merges --format='%H%x1f%h%x1f%s%x1f%an' "$range")
            if [[ -n "$commits" ]]; then
              notes+=$'\n\n'"## Commits"$'\n\n'"$commits"
            fi
          fi

          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - refreshing notes"
            gh release edit "$TAG" --notes "$notes" ${flags[@]+"${flags[@]}"}
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes "$notes" \
              ${flags[@]+"${flags[@]}"}
          fi
