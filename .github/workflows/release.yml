name: release

# Publish a GitHub Release for a version tag.
#
# Release notes come from GitHub's own "What's Changed" generator. When it
# has nothing to list (commits pushed straight to main instead of through
# pull requests) the workflow appends an explicit commit list.
#
# Two ways in:
#   push(tag v*)      -> publish that tag
#   workflow_dispatch -> publish the version typed by hand (0.3.1 or v0.3.1)
#
# A release that already exists is never rewritten: the run stops with a
# notice, so re-pushing a tag or repeating a dispatch is a no-op. Delete the
# release first if its notes really have to be regenerated.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.3.1; the v prefix is optional)
        required: true
        type: string

permissions:
  contents: write

# Never race two publishes of the same tag.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          raw="${raw#refs/tags/}"
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v$tag"
          # Consumers fetch this version as a Go module, so only accept a
          # semver tag; a stray name must not become a release.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' does not resolve to a vX.Y.Z version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # v0.4.0-rc.1 and friends are pre-releases, never "latest".
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved '$raw' -> $tag"

      # Stop here when the release is already published: nothing is rebuilt
      # and nothing is overwritten.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release $TAG already exists - skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ${{ steps.version.outputs.tag }}
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git checkout --force "refs/tags/${{ steps.version.outputs.tag }}"

      - uses: actions/setup-go@v7
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      # Gate the release on the same checks as build.yml: a tag is not
      # covered by the branch CI, so verify it here before publishing.
      - name: Build
        if: steps.existing.outputs.skip != 'true'
        run: go build ./...

      - name: Build (with_gvisor)
        if: steps.existing.outputs.skip != 'true'
        run: go build -tags with_gvisor ./...

      - name: Vet
        if: steps.existing.outputs.skip != 'true'
        run: go vet ./...

      - name: Test
        if: steps.existing.outputs.skip != 'true'
        run: go test ./...

      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # GitHub's generated body for this tag ("What's Changed").
          notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)"

          # The generator only summarises merged pull requests, so commits
          # pushed straight to main never show up. When it listed nothing,
          # fall back to an explicit commit list: subject by author in sha.
          if ! grep -q "## What's Changed" <<<"$notes"; then
            prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
            range="$TAG"
            if [[ -n "$prev" ]]; then range="${prev}..${TAG}"; fi
            echo "generated notes have no What's Changed section - listing $range"
            commits=""
            while IFS=$'\x1f' read -r sha short subject author; do
              commits+="- ${subject} by ${author} in [${short}](${repo_url}/commit/${sha})"$'\n'
            done < <(git log --no-merges --format='%H%x1f%h%x1f%s%x1f%an' "$range")
            if [[ -n "$commits" ]]; then
              notes+=$'\n\n'"## Commits"$'\n\n'"$commits"
            fi
          fi

          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes "$notes" \
            ${flags[@]+"${flags[@]}"}
