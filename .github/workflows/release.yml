name: release

# Publish a GitHub Release for a version tag.
#
# The notes are assembled here: "What's Changed" is written from the commits
# in the range (GitHub itself only lists merged pull requests, and this repo
# commits straight to main), while GitHub's own "New Contributors" section
# and Full Changelog link are kept as-is.
#
# Two ways in:
#   push(tag v*)      -> publish that tag
#   workflow_dispatch -> publish the version typed by hand (0.3.1 or v0.3.1)
#
# A release that already exists is never rewritten: the run stops with a
# notice, so re-pushing a tag or repeating a dispatch is a no-op. Delete the
# release first if its notes really have to be regenerated.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.3.1; the v prefix is optional)
        required: true
        type: string

permissions:
  contents: write

# Never race two publishes of the same tag.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          raw="${raw#refs/tags/}"
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v$tag"
          # Consumers fetch this version as a Go module, so only accept a
          # semver tag; a stray name must not become a release.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' does not resolve to a vX.Y.Z version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # v0.4.0-rc.1 and friends are pre-releases, never "latest".
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved '$raw' -> $tag"

      # Stop here when the release is already published: nothing is rebuilt
      # and nothing is overwritten.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release $TAG already exists - skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ${{ steps.version.outputs.tag }}
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git checkout --force "refs/tags/${{ steps.version.outputs.tag }}"

      - uses: actions/setup-go@v7
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      # Gate the release on the same checks as build.yml: a tag is not
      # covered by the branch CI, so verify it here before publishing.
      - name: Build
        if: steps.existing.outputs.skip != 'true'
        run: go build ./...

      - name: Build (with_gvisor)
        if: steps.existing.outputs.skip != 'true'
        run: go build -tags with_gvisor ./...

      - name: Vet
        if: steps.existing.outputs.skip != 'true'
        run: go vet ./...

      - name: Test
        if: steps.existing.outputs.skip != 'true'
        run: go test ./...

      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Our own "What's Changed": GitHub only summarises merged pull
          # requests, and this repo commits straight to main. Entries follow
          # the GitHub style: subject by @author in `sha`.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          range="$TAG"
          if [[ -n "$prev" ]]; then range="${prev}..${TAG}"; fi
          echo "building What's Changed for $range"

          changes=""
          while IFS=$'\x1f' read -r sha short subject author; do
            login="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" \
              --jq '.author.login // empty' 2>/dev/null || true)"
            by="$author"
            if [[ -n "$login" ]]; then by="@${login}"; fi
            if [[ -n "$changes" ]]; then changes+=$'\n'; fi
            changes+="* ${subject} by ${by} in \`${short}\`"
          done < <(git log --no-merges --format='%H%x1f%h%x1f%s%x1f%an' "$range")

          # Keep only GitHub's contributor list and Full Changelog line; its
          # generated "What's Changed" body is replaced by the list above.
          generated="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)"
          contributors="$(printf '%s\n' "$generated" | awk '
            /^## New Contributors/ { on = 1 }
            /^\*\*Full Changelog\*\*/ { on = 0 }
            on { buf[++n] = $0 }
            END {
              while (n > 0 && buf[n] ~ /^[[:space:]]*$/) n--
              for (i = 1; i <= n; i++) print buf[i]
            }')"
          changelog="$(printf '%s\n' "$generated" | grep -m1 '^\*\*Full Changelog\*\*' || true)"

          notes=""
          if [[ -n "$changes" ]]; then
            notes="## What's Changed"$'\n\n'"$changes"
          fi
          if [[ -n "$(printf '%s' "$contributors" | tr -d '[:space:]')" ]]; then
            if [[ -n "$notes" ]]; then notes+=$'\n\n'; fi
            notes+="$contributors"
          fi
          if [[ -n "$changelog" ]]; then
            if [[ -n "$notes" ]]; then notes+=$'\n\n'; fi
            notes+="$changelog"
          fi

          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes "$notes" \
            ${flags[@]+"${flags[@]}"}
